<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a0d">
  <title>Password recovery | TELECTRO</title>
  <style>
    :root{color-scheme:dark;--bg:#080a0d;--panel:#111720;--line:#ffffff17;--text:#f5f7fb;--muted:#9ba6b5;--blue:#438cff;--red:#ff8c96;--green:#57d59b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(100%,440px);padding:30px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 80px #0008}h1{margin:0 0 8px;font-size:26px}p{color:var(--muted);margin:0 0 22px}.field{margin:18px 0}.field label{display:block;margin-bottom:7px;font-size:14px}.field input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;background:#080a0d;color:var(--text);font:inherit}.btn{width:100%;padding:12px;border:0;border-radius:9px;background:var(--blue);color:white;font:600 15px inherit;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}.message{min-height:24px;margin:14px 0 0;font-size:14px}.message.error{color:var(--red)}.message.success{color:var(--green)}a{display:inline-block;margin-top:18px;color:#91bcff}form[hidden],section[hidden]{display:none}
  </style>
</head>
<body>
  <main class="card">
    <h1 id="heading">Forgot your password?</h1>
    <p id="intro">Enter the email address on your account and we’ll send you a secure password-reset link.</p>

    <form id="requestForm">
      <div class="field"><label for="email">Account email</label><input id="email" type="email" autocomplete="email" required maxlength="254"></div>
      <button class="btn" type="submit">Send reset link</button>
    </form>

    <section id="updateSection" hidden>
      <form id="updateForm">
        <div class="field"><label for="password">New password (at least 8 characters)</label><input id="password" type="password" autocomplete="new-password" minlength="8" required></div>
        <div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div>
        <button class="btn" type="submit">Save new password</button>
      </form>
    </section>

    <p id="message" class="message" role="status" aria-live="polite"></p>
    <a href="/">Back to Telectro</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    'use strict';
    const config = window.TELECTRO_CONFIG || {};
    const message = document.getElementById('message');
    const requestForm = document.getElementById('requestForm');
    const updateSection = document.getElementById('updateSection');
    const client = window.supabase && config.url && config.anonKey
      ? window.supabase.createClient(config.url, config.anonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } })
      : null;

    function showMessage(text, type = '') { message.textContent = text; message.className = 'message ' + type; }
    function showPasswordForm() {
      requestForm.hidden = true;
      updateSection.hidden = false;
      document.getElementById('heading').textContent = 'Choose a new password';
      document.getElementById('intro').textContent = 'Set a new password for your Telectro account.';
    }

    if (!client) showMessage('Authentication is not configured. Please contact Telectro support.', 'error');
    else {
      client.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' && session) showPasswordForm();
      });
      // Supabase may restore the recovery session before the event listener runs.
      client.auth.getSession().then(({ data }) => {
        if (data.session && window.location.hash.includes('type=recovery')) showPasswordForm();
      });
    }

    requestForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!client) return;
      const button = requestForm.querySelector('button');
      button.disabled = true;
      showMessage('Sending reset link…');
      const { error } = await client.auth.resetPasswordForEmail(document.getElementById('email').value.trim(), {
        redirectTo: window.location.href.split('#')[0].split('?')[0]
      });
      button.disabled = false;
      if (error) {
        showMessage('Could not send the reset link. Check the email address and try again, or contact support.', 'error');
        return;
      }
      showMessage('If an account exists for that email, a password-reset link will be sent. Check your inbox and spam folder.', 'success');
    });

    document.getElementById('updateForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!client) return;
      const password = document.getElementById('password').value;
      const confirmation = document.getElementById('confirmPassword').value;
      if (password !== confirmation) { showMessage('The passwords do not match.', 'error'); return; }
      const button = event.currentTarget.querySelector('button');
      button.disabled = true;
      showMessage('Updating password…');
      const { error } = await client.auth.updateUser({ password });
      button.disabled = false;
      if (error) { showMessage(error.message || 'Could not update the password. Request a new reset link and try again.', 'error'); return; }
      showMessage('Password updated. You can now sign in with your new password.', 'success');
      document.getElementById('updateForm').reset();
      await client.auth.signOut();
    });
  </script>
</body>
</html>
