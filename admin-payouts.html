<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14"><title>Admin sign in | TELECTRO</title>
<link rel="stylesheet" href="/site-theme.css">
<style>
:root{color-scheme:dark;--bg:#070b14;--s1:#0f1626;--line:#ffffff14;--ink:#f1f4fb;--mut:#8f9bb3;--acc:#4f7cff;--bad:#ff6b7d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,sans-serif}.card{width:min(440px,100%);background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 20px 60px #0006}.brand{font-weight:800;letter-spacing:2px}.brand i{font-style:normal;color:var(--acc)}h1{font-size:30px;letter-spacing:-1px;margin:26px 0 6px}.sub{color:var(--mut);margin:0 0 24px}.field{margin:0 0 15px}label{display:block;color:var(--mut);font-size:13px;font-weight:650;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#070b14;color:var(--ink);font:inherit}input:focus{outline:2px solid #4f7cff66;border-color:var(--acc)}button{width:100%;border:0;border-radius:11px;padding:12px;background:linear-gradient(135deg,#4f7cff,#6a5cff);color:#fff;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.msg{min-height:22px;color:var(--mut);font-size:13px}.msg.error{color:var(--bad)}a{color:var(--mut)}
</style>
</head>
<body>
<main class="card"><a class="brand" href="/"><i>T.</i> TELECTRO</a><h1>Administrator sign in</h1><p class="sub">Use your assigned admin username and your existing account password.</p>
<form id="loginForm"><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]{3,32}" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required></div><button id="submit" type="submit">Sign in to admin dashboard</button><p class="msg" id="message" role="status" aria-live="polite"></p></form><a href="/">← Back to Telectro</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js"></script>
<script>
'use strict';
const config=window.TELECTRO_CONFIG||{},client=window.supabase&&config.url&&config.anonKey?window.supabase.createClient(config.url,config.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null,$=id=>document.getElementById(id);
async function existingAdmin(){if(!client)return;const {data:{session}}=await client.auth.getSession();if(!session)return;const {data}=await client.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(data?.role==='admin')location.replace('/');else await client.auth.signOut()}
existingAdmin();
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const button=$('submit'),message=$('message');if(!client){message.textContent='Authentication is not configured. Check supabase-config.js.';message.className='msg error';return}button.disabled=true;button.textContent='Signing in…';message.textContent='';try{const {data,error}=await client.functions.invoke('admin-login',{body:{username:$('username').value.trim().toLowerCase(),password:$('password').value}});if(error||!data?.session)throw new Error(data?.error||'Invalid username or password.');const {error:sessionError}=await client.auth.setSession({access_token:data.session.access_token,refresh_token:data.session.refresh_token});if(sessionError)throw sessionError;location.replace('/')}catch(err){message.textContent=err.message||'Could not sign in. Check your credentials and try again.';message.className='msg error';button.disabled=false;button.textContent='Sign in to admin dashboard'}});
</script>
</body></html>
