<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b14">
<title>Admin sign in | TELECTRO</title>
<link rel="stylesheet" href="/site-theme.css">
<style>
:root{color-scheme:dark;--bg:#070b14;--s1:#0f1626;--line:#ffffff14;--ink:#f1f4fb;--mut:#8f9bb3;--acc:#4f7cff;--bad:#ff6b7d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(440px,100%);padding:30px;background:var(--s1);border:1px solid var(--line);border-radius:18px}.brand{font-weight:800;letter-spacing:2px;text-decoration:none;color:var(--ink)}.brand i{font-style:normal;color:var(--acc)}h1{font-size:25px;margin:26px 0 5px}.sub{color:var(--mut);font-size:13px;margin:0 0 22px}.field{margin:0 0 15px}label{display:block;color:var(--mut);font-size:12px;font-weight:650;margin-bottom:6px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}input:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px #4f7cff26}button{width:100%;border:0;border-radius:10px;padding:12px;background:var(--acc);color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.msg{min-height:22px;margin:12px 0;color:var(--bad);font-size:13px}.back{color:var(--mut);font-size:13px;text-decoration:none}.back:hover{color:var(--ink)}
</style>
</head>
<body>
<main class="card">
  <a class="brand" href="/"><i>T.</i> TELECTRO</a>
  <h1>Administrator sign in</h1>
  <p class="sub">Sign in with your admin account’s mobile number and password.</p>
  <form id="loginForm">
    <div class="field"><label for="phone">Mobile number</label><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+2348012345678" maxlength="20" required></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required></div>
    <button id="submit" type="submit">Sign in to admin dashboard</button>
    <p class="msg" id="message" role="status" aria-live="polite"></p>
  </form>
  <a class="back" href="/">← Back to Telectro</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<script>
'use strict';
const config=window.TELECTRO_CONFIG||{};
const client=window.supabase&&config.url&&config.anonKey?window.supabase.createClient(config.url,config.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
const $=id=>document.getElementById(id);
function normalizePhone(value){const trimmed=value.trim(),hadPlus=trimmed.startsWith('+');let digits=trimmed.replace(/\D/g,'');if(!digits)return '';if(digits.startsWith('00'))digits=digits.slice(2);if(digits.startsWith('0')&&digits.length===11)digits=`234${digits.slice(1)}`;else if(!hadPlus&&digits.length===10)digits=`234${digits}`;if(digits.length<8||digits.length>15)return '';return `+${digits}`}
async function redirectIfAdmin(){if(!client)return;const {data:{session}}=await client.auth.getSession();if(!session)return;const {data,error}=await client.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(!error&&data?.role==='admin')location.replace('/');else await client.auth.signOut()}
redirectIfAdmin();
$('loginForm').addEventListener('submit',async event=>{event.preventDefault();const button=$('submit'),message=$('message');message.textContent='';if(!client){message.textContent='Authentication is not configured. Check supabase-config.js.';return}const phone=normalizePhone($('phone').value),password=$('password').value;if(!phone){message.textContent='Enter a valid phone number, including your country code.';return}button.disabled=true;button.textContent='Signing in…';try{const {data,error}=await client.auth.signInWithPassword({phone,password});if(error)throw error;const {data:profile,error:profileError}=await client.from('profiles').select('role').eq('id',data.user.id).maybeSingle();if(profileError||profile?.role!=='admin'){await client.auth.signOut();throw new Error('This account does not have administrator access.')}location.replace('/')}catch(error){message.textContent=error.message||'Sign-in failed. Check your mobile number and password.';button.disabled=false;button.textContent='Sign in to admin dashboard'}});
</script>
</body>
</html>
